services:
  kafka-0:
    image: apache/kafka${NATIVE}:${KAFKA_VERSION}
    container_name: kafka-0
    networks:
      - net_common
    user: root
    ports:
      - 19092:9092
    environment:
      # KRaft
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker # kafka角色, 做broker, 也要做controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093 # 集群地址
      - KAFKA_CLUSTER_ID=abcdefghijklmnopqrstuv # 使用Kafka时的集群id, 集群内的Kafka都要用这个id做初始化, UUID即可

      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER # 指定供外部使用的控制类请求信息
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 # 定义kafka服务端socket监听端口
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT # 定义安全协议
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT # broker 间通信使用的监听器
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M # 设置broker最大内存, 和初始内存
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false # 不允许自动创建主题
      - KAFKA_LOG_DIRS=/var/lib/kafka/data # 数据目录, 需与 volumes 挂载路径一致
      ### broker配置
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://mini.rx:19092 # mini.rx:19092 # 定义外网访问地址（宿主机ip地址和端口）
      - KAFKA_BROKER_ID=0 # broker.id, 必须唯一（KRaft 模式下实际由 KAFKA_NODE_ID 决定）
      # Clustering
      # KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      # KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      # KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
    volumes:
      - $HOME/docker/kafka_v3/kafka-0/kafka/kraft:/var/lib/kafka/data

  kafka-1:
    image: apache/kafka${NATIVE}:${KAFKA_VERSION}
    container_name: kafka-1
    networks:
      - net_common
    user: root
    ports:
      - 29092:9092
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - KAFKA_CLUSTER_ID=abcdefghijklmnopqrstuv

      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_LOG_DIRS=/var/lib/kafka/data

      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://mini.rx:29092 # mini.rx:29092
      - KAFKA_BROKER_ID=1
    volumes:
      - $HOME/docker/kafka_v3/kafka-1/kafka/kraft:/var/lib/kafka/data

  kafka-2:
    image: apache/kafka${NATIVE}:${KAFKA_VERSION}
    container_name: kafka-2
    networks:
      - net_common
    user: root
    ports:
      - 39092:9092
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - KAFKA_CLUSTER_ID=abcdefghijklmnopqrstuv

      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_LOG_DIRS=/var/lib/kafka/data

      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://mini.rx:39092 # mini.rx:39092
      - KAFKA_BROKER_ID=2
    volumes:
      - $HOME/docker/kafka_v3/kafka-2/kafka/kraft:/var/lib/kafka/data

networks:
  net_common:
    external: true
