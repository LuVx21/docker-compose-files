services:
  kafbat-ui:
    container_name: kafbat-ui
    image: ${GH_CR_NJU}/kafbat/kafka-ui:latest
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      SWAGGER_UI_ENABLED: 'true'
    # volumes:
    #   - ~/kui/config.yml:/etc/kafkaui/dynamic_config.yaml

  kafka-console-ui:
    build:
      dockerfile: Dockerfile-kafka-console-ui
    image: luvx/kafka-console-ui:latest
    container_name: kafka-console-ui
    networks:
      - net_common
    ports:
      - 7766:7766
    volumes:
      - $HOME/docker/kafka-console-ui/data:/app/data
      - $HOME/docker/kafka-console-ui/log:/app/log
      # - ./ca.pem:/etc/certs/ca.pem:ro
    privileged: true

