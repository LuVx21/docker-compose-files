name: Maximize-Disk

description: 清理出更多空间

inputs:
  rootReserveMb:
    description: 根分区保留空间（MB）
    required: false
    default: '1536'
  swapSizeMb:
    description: Swap 大小（MB）
    required: false
    default: '2048'

runs:
  using: composite
  steps:
    - name: 参数信息
      shell: bash
      run: |
        echo "=============================================================================="
        echo "rootReserveMb: ${{ inputs.rootReserveMb }}"
        echo "swapSizeMb:    ${{ inputs.swapSizeMb }}"
        echo "=============================================================================="
    - name: 磁盘信息-清理前
      shell: bash
      run: |
        echo "磁盘信息"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="
    - name: 增加构建磁盘空间
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: ${{ inputs.rootReserveMb }}
        swap-size-mb: ${{ inputs.swapSizeMb }}
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        # remove-docker-images: 'true'
        # build-mount-path: '/var/lib/docker/'
    - name: 磁盘信息--清理后
      shell: bash
      run: |
        echo "磁盘信息"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="
