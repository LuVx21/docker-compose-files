name: 同步DockerHub镜像

on:
  # schedule:
  #   - cron: "23 3 1 * *"
  push:
    branches: [ master ]
    paths:
      - images.txt
  workflow_dispatch:
    inputs:
      dockerhub_images:
        description: '要拉取的镜像,如"foo/bar:v1#bar/foo:v2"(支持花括号展开,空则读取images.txt)'
        required: false
        default: ''
      remote:
        description: '使用远程gist的images.txt'
        required: false
        default: true
        type: boolean
      skopeo:
        description: '使用Skopeo'
        required: false
        default: true
        type: boolean

jobs:
  sync:
    name: 同步镜像
    runs-on: ubuntu-latest
    # permissions:
    #   contents: read
    #   packages: write
    steps:
      - name: 参数信息
        run: |
          echo "=============================================================================="
          echo "输入镜像名:        ${{ inputs.dockerhub_images }}"
          echo "使用gist images:   ${{ inputs.remote }}"
          echo "使用Skopeo:        ${{ inputs.skopeo }}"
          echo "=============================================================================="
      - name: 代码检出
        uses: actions/checkout@v7
      # 增加可用磁盘空间
      - name: 增加构建磁盘空间
        uses: ./.github/actions/maximize
      - name: 重启Docker服务
        run: sudo service docker restart
      - name: 登录GitHub容器
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_CR_PASSWORD }}
      - name: 小写GitHub用户名(namespace)
        run: echo "ACTOR_LOWER=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: 登录阿里云容器
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ALI_CR }}
          username: ${{ secrets.ALI_CR_USER }}
          password: ${{ secrets.ALI_CR_PASSWORD }}
      # - name: 登录腾讯云容器
      #   uses: docker/login-action@v4
      #   with:
      #     registry: ${{ vars.TX_CR }}
      #     username: ${{ secrets.TX_CR_USER }}
      #     password: ${{ secrets.TX_CR_PASSWORD }}
      - name: 解析输入
        if: ${{ inputs.dockerhub_images != '' }}
        env:
          INPUT_IMAGES: ${{ inputs.dockerhub_images }}
        run: |
          {
            echo "SYNC_IMAGES<<EOF_IMAGES"
            echo "${INPUT_IMAGES//#/$'\n'}"
            echo
            echo "EOF_IMAGES"
          } >> "$GITHUB_ENV"

      - name: 读取仓库images.txt
        if: ${{ inputs.dockerhub_images == '' && inputs.remote == false }}
        run: |
          {
            echo "SYNC_IMAGES<<EOF_IMAGES"
            cat images.txt
            echo
            echo "EOF_IMAGES"
          } >> "$GITHUB_ENV"

      - name: 读取远程gist images.txt
        if: ${{ inputs.dockerhub_images == '' && inputs.remote }}
        run: |
          curl -fsSL https://gist.githubusercontent.com/LuVx21/dec395659156b528558b38ee89126113/raw/images.txt -o /tmp/images.txt
          {
            echo "SYNC_IMAGES<<EOF_IMAGES"
            cat /tmp/images.txt
            echo
            echo "EOF_IMAGES"
          } >> "$GITHUB_ENV"

      # - name: Install Skopeo-M1
      #   if: ${{ inputs.skopeo }}
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y skopeo
      #     skopeo --version

      - name: Install Skopeo-M2
        if: ${{ inputs.skopeo }}
        uses: warjiang/setup-skopeo@main
        with:
          version: latest

      - name: 迁移镜像
        uses: step-security/retry@v4
        env:
          SKOPEO_ENABLE: ${{ inputs.skopeo }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
        with:
          timeout_minutes: 360
          max_attempts: 3
          command: |
            images="$SYNC_IMAGES"
            docker_registry=$(echo "${DOCKER_REGISTRY}" | grep -v '^,')
            docker_registry=$(echo "${docker_registry}" | grep -v '^ghcr')

            replace_image() {
              local image="$1"
              echo "${image//\//_}"
            }

            combine_providers() {
              local mul_line="$1"
              local image="$2"

              local line domain ns
              while IFS= read -r line; do
                [[ -z "${line//[[:space:]]/}" ]] && continue   # 跳过空行
                domain="${line%%,*}"                            # 第一个逗号前
                ns="${line#*,}"                                 # 第一个逗号后
                # 去掉两侧空白
                domain="${domain#"${domain%%[![:space:]]*}"}"
                domain="${domain%"${domain##*[![:space:]]}"}"
                ns="${ns#"${ns%%[![:space:]]*}"}"
                ns="${ns%"${ns##*[![:space:]]}"}"
                echo "${domain:+$domain/}${ns}/${image}"
              done <<< "$mul_line"
            }

            while IFS= read -r image_line; do
              [[ -z "$image_line" || "$image_line" =~ ^[[:space:]]*# ]] && continue
              echo "------------------------------------------${image_line}----------------------------------------------"
              for image in $(eval "echo $image_line"); do
                targets=()
                replaced=$(replace_image "${image}")
                nn=$(combine_providers "${docker_registry}" "${replaced}")
                while IFS= read -r registry_image_tag; do
                  [ -n "$registry_image_tag" ] || continue
                  # 方式1：skopeo（启用前先安装 skopeo）
                  if [[ ${SKOPEO_ENABLE} == true ]]; then
                    echo "skopeo复制: ${image} => ${registry_image_tag}"
                    skopeo copy --multi-arch=linux/amd64,linux/arm64 \
                      --strip-removed-platforms --remove-list-signatures \ # 要一起用
                      # --preserve-digests \ # 和上面的冲突
                      --retry-times 3 \
                      --authfile "$HOME/.docker/config.json" \
                      "docker://${image}" \
                      "docker://${registry_image_tag}"
                  fi
                  targets+=("-t" "${registry_image_tag}")
                done <<< "$nn"

                # 方式2：docker buildx imagetools create
                if [[ ${SKOPEO_ENABLE} == false ]]; then
                  docker buildx imagetools create "${targets[@]}" "${image}"
                fi
              done
              docker system prune -f
            done <<< "$images"
